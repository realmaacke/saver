# Automated code review.
name: clang-tidy-review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'meson.build'
      - 'tests/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ZedThree/clang-tidy-review@v0.23.1
        id: review
        with:
          build_dir: build
          base_dir: build
          apt_packages: >-
            meson,
            ninja-build,
            pkg-config,
            g++
          cmake_command: >-
            meson setup build &&
            python3 -c "import json;
            p = 'build/compile_commands.json';
            data = json.load(open(p));
            [e.update({'file': e['file'].replace('../', '')}) for e in data];
            json.dump(data, open(p, 'w'))"
          exclude: "external/*,subprojects/*,.old/*"

      - if: steps.review.outputs.total_comments > 0
        run: exit 1

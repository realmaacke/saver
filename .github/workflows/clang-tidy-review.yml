# Automated code review.
name: clang-tidy-review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'meson.build'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ZedThree/clang-tidy-review@v0.19.0
        id: review
        with:
          build_dir: build
          apt_packages: >-
            meson,
            ninja-build,
            pkg-config,
            g++
          cmake_command: meson setup build
          exclude: "external/*,subprojects/*,.old/*"

      - if: steps.review.outputs.total_comments > 0
        run: exit 1
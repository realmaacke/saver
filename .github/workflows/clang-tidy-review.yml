# Automated code review.
name: clang-tidy-review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'meson.build'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Meson and Generate Compdb
        run: |
          meson setup build
          ninja -C build -t compdb > build/compile_commands.json


      - uses: ZedThree/clang-tidy-review@v0.23.1
        id: review
        with:
          build_dir: build
          apt_packages: >-
            meson,
            ninja-build,
            pkg-config,
            g++
          cmake_command: "true"
          exclude: "external/*,subprojects/*,.old/*"

      - if: steps.review.outputs.total_comments > 0
        run: exit 1